<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <style type="text/css"><![CDATA[
      .box { fill: #ffffff; stroke: #2f3b52; stroke-width: 2; rx: 8; ry: 8; }
      .title { font-family: -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial; font-size: 18px; fill: #1f2937; font-weight: 600; }
      .small { font-family: -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial; font-size: 14px; fill: #374151; }
      .arrow { stroke: #6b7280; stroke-width: 2; marker-end: url(#arrowhead); fill: none; }
      .label { font-family: -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial; font-size: 14px; fill: #111827; }
      .bg { fill: #f9fafb; }
    ]]></style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="700" />

  <!-- Row 1: User -> App/CLI -->
  <rect class="box" x="60" y="40" width="160" height="60" />
  <text class="title" x="140" y="75" text-anchor="middle">User</text>

  <rect class="box" x="300" y="40" width="240" height="60" />
  <text class="title" x="420" y="70" text-anchor="middle">App (Flask) / CLI</text>

  <line class="arrow" x1="220" y1="70" x2="300" y2="70" />
  <text class="label" x="260" y="62" text-anchor="middle">prompt</text>

  <!-- Row 2: Agent 1 center -->
  <rect class="box" x="560" y="40" width="180" height="60" />
  <text class="title" x="650" y="72" text-anchor="middle">Agent 1</text>

  <line class="arrow" x1="540" y1="70" x2="560" y2="70" />

  <!-- Tools under Agent 1 -->
  <rect class="box" x="520" y="160" width="200" height="60" />
  <text class="title" x="620" y="192" text-anchor="middle">Length Tool</text>
  <text class="small" x="620" y="212" text-anchor="middle">string length → row</text>

  <rect class="box" x="760" y="160" width="240" height="60" />
  <text class="title" x="880" y="192" text-anchor="middle">Birthday Tool</text>
  <text class="small" x="880" y="212" text-anchor="middle">day-of-month → col</text>

  <!-- Arrows from Agent 1 to tools and back -->
  <line class="arrow" x1="650" y1="100" x2="620" y2="160" />
  <line class="arrow" x1="740" y1="100" x2="880" y2="160" />

  <line class="arrow" x1="620" y1="220" x2="650" y2="260" />
  <text class="label" x="640" y="252" text-anchor="middle">row</text>

  <line class="arrow" x1="880" y1="220" x2="700" y2="260" />
  <text class="label" x="790" y="252" text-anchor="middle">col</text>

  <!-- CSV Reader -->
  <rect class="box" x="560" y="260" width="260" height="60" />
  <text class="title" x="690" y="292" text-anchor="middle">CSVReader</text>
  <text class="small" x="690" y="312" text-anchor="middle">reads data/questionList.csv</text>

  <line class="arrow" x1="650" y1="100" x2="690" y2="260" />
  <text class="label" x="665" y="170" text-anchor="middle">row,col</text>

  <!-- Agent 2 -->
  <rect class="box" x="560" y="380" width="180" height="60" />
  <text class="title" x="650" y="412" text-anchor="middle">Agent 2</text>

  <line class="arrow" x1="690" y1="320" x2="650" y2="380" />
  <text class="label" x="660" y="352" text-anchor="middle">question</text>

  <!-- Tavily tool -->
  <rect class="box" x="820" y="380" width="230" height="60" />
  <text class="title" x="935" y="412" text-anchor="middle">Tavily Web Search</text>

  <line class="arrow" x1="740" y1="410" x2="820" y2="410" />
  <text class="label" x="780" y="402" text-anchor="middle">tool</text>

  <line class="arrow" x1="930" y1="440" x2="650" y2="440" />
  <text class="label" x="790" y="460" text-anchor="middle">final answer</text>

  <!-- Slack tool -->
  <rect class="box" x="300" y="380" width="160" height="60" />
  <text class="title" x="380" y="412" text-anchor="middle">Slack Tool</text>

  <line class="arrow" x1="560" y1="410" x2="460" y2="410" />
  <text class="label" x="510" y="402" text-anchor="middle">post</text>

  <!-- Back to User -->
  <line class="arrow" x1="380" y1="440" x2="140" y2="440" />
  <text class="label" x="260" y="460" text-anchor="middle">message to channel</text>

  <rect class="box" x="60" y="410" width="160" height="60" />
  <text class="title" x="140" y="445" text-anchor="middle">User</text>

</svg>
