<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Puzzle Agent Chat</title>
    <style>
      :root {
        --bg-1: #f5f7fb;
        --bg-2: #ffffff;
        --card: rgba(255,255,255,0.9);
        --stroke: rgba(15,23,42,0.08);
        --text: #0f172a;
        --muted: #475569;
        --accent: #3b82f6;
        --accent-2: #06b6d4;
        --user: #eef2f7;
        --bot: #dbeafe;
        --shadow: 0 8px 24px rgba(0,0,0,0.12);
      }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: radial-gradient(1200px 800px at 10% -10%, rgba(59,130,246,0.12), transparent),
                    radial-gradient(1000px 700px at 110% 10%, rgba(6,182,212,0.10), transparent),
                    linear-gradient(180deg, var(--bg-1), var(--bg-2));
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, 'Helvetica Neue', Arial;
        display: flex;
        align-items: stretch;
        justify-content: center;
      }
      .container { width: 100%; max-width: 960px; padding: 32px 20px; }
      .header {
        display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;
      }
      .brand { display: flex; gap: 10px; align-items: center; }
      .badge { background: linear-gradient(135deg, var(--accent), var(--accent-2)); width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; box-shadow: var(--shadow); }
      .title { font-weight: 700; font-size: 22px; letter-spacing: 0.5px; }

      .chat-card { background: var(--card); border: 1px solid var(--stroke); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); backdrop-filter: blur(8px); }
      .messages { height: 60vh; overflow-y: auto; padding: 16px; background: rgba(255,255,255,0.6); }
      .msg { margin: 10px 0; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--stroke); width: fit-content; max-width: 90%; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
      .msg.user { background: var(--user); margin-left: auto; }
      .msg.bot { background: var(--bot); }
      .meta { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
      .footer { padding: 12px; border-top: 1px solid var(--stroke); display: grid; grid-template-columns: 1fr auto; gap: 10px; background: rgba(0,0,0,0.12); }
      input[type="text"] { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--stroke); background: #ffffff; color: var(--text); outline: none; }
      input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,130,246,0.20); }
      button { padding: 12px 16px; border: none; border-radius: 10px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: white; cursor: pointer; font-weight: 600; box-shadow: var(--shadow); }
      button:disabled { opacity: 0.6; cursor: not-allowed; }
      .tip { color: var(--muted); font-size: 12px; padding: 12px; }
      pre { white-space: pre-wrap; word-break: break-word; margin: 0; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="brand">
          <div class="badge">🧩</div>
          <div class="title">Puzzle Agent Chat</div>
        </div>
      </div>

      <div class="chat-card">
        <div id="messages" class="messages"></div>
        <div class="footer">
          <input id="message" name="message" type="text" placeholder="Type your request and press Enter…" autocomplete="off" />
          <button id="sendBtn" type="button">Send</button>
        </div>
      </div>
      <div class="tip">Tip: Try “Hey puzzle agent, please solve this end-to-end: 1) Calculate the length of 'Hello AI'. 2) Find the numeric day …”</div>
    </div>

    <script>
      const form = document.getElementById('chatForm');
      const input = document.getElementById('message');
      const sendBtn = document.getElementById('sendBtn');
      const messages = document.getElementById('messages');

      function addMessage(text, who = 'bot') {
        const div = document.createElement('div');
        div.className = `msg ${who}`;
        div.innerHTML = `<pre>${text}</pre>`;
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
      }

      async function submitMessage() {
        const text = input.value.trim();
        if (!text) return;
        addMessage(text, 'user');
        input.value = '';
        sendBtn.disabled = true;
        try {
          const res = await fetch('/process', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Request failed');

          const parts = [];
          if (data.first_agent_output) parts.push(`First agent:\n${data.first_agent_output}`);
          if (data.row !== null && data.column !== null) parts.push(`ROW=${data.row}; COLUMN=${data.column}`);
          if (data.question) parts.push(`QUESTION: ${data.question}`);
          if (data.second_agent_output) parts.push(`Answer:\n${data.second_agent_output}`);
          addMessage(parts.join('\n\n'), 'bot');

          // Confetti celebration if we produced a final answer
          if (data.second_agent_output) {
            launchConfetti();
          }
        } catch (err) {
          addMessage('Error: ' + err.message, 'bot');
        } finally {
          sendBtn.disabled = false;
        }
      }

      // Send on button click or Enter
      sendBtn.addEventListener('click', submitMessage);
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          submitMessage();
        }
      });

      function launchConfetti() {
        if (typeof confetti === 'function') {
          const duration = 1800;
          const animationEnd = Date.now() + duration;
          const defaults = { startVelocity: 40, spread: 360, ticks: 80, zIndex: 1000 };
          const interval = setInterval(function() {
            const timeLeft = animationEnd - Date.now();
            if (timeLeft <= 0) return clearInterval(interval);
            const particleCount = 60 * (timeLeft / duration);
            confetti({ ...defaults, particleCount, origin: { x: Math.random() * 0.2 + 0.1, y: Math.random() - 0.2 } });
            confetti({ ...defaults, particleCount, origin: { x: Math.random() * 0.2 + 0.7, y: Math.random() - 0.2 } });
          }, 200);
        } else {
          // Fallback simple confetti (DOM-based)
          const count = 120;
          const colors = ['#60a5fa', '#22d3ee', '#34d399', '#f59e0b', '#f472b6'];
          for (let i = 0; i < count; i++) {
            const el = document.createElement('div');
            el.style.position = 'fixed';
            el.style.top = '-10px';
            el.style.left = Math.random() * 100 + 'vw';
            el.style.width = '8px';
            el.style.height = '14px';
            el.style.background = colors[Math.floor(Math.random()*colors.length)];
            el.style.opacity = '0.9';
            el.style.transform = `rotate(${Math.random()*360}deg)`;
            el.style.borderRadius = '2px';
            el.style.zIndex = 1000;
            document.body.appendChild(el);
            const fall = (start) => {
              const startTime = start || performance.now();
              const tick = (now) => {
                const t = (now - startTime) / 1800;
                if (t >= 1) { el.remove(); return; }
                const y = t * 100;
                const x = Math.sin(t * 6) * 20; // sway
                el.style.transform = `translate(${x}px, ${y}vh) rotate(${t*720}deg)`;
                requestAnimationFrame(tick);
              };
              requestAnimationFrame(tick);
            };
            fall();
          }
        }
      }
    </script>
  </body>
  </html>
